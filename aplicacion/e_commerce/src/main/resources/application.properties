# ==============================================
# CONFIGURACIÓN BASE DE LA APLICACIÓN
# ==============================================
spring.application.name=TPO-SE-Ecommerce
server.port=8080

# ==============================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ==============================================
# Soporta configuración para Docker mediante variables de entorno
# Por defecto usa MySQL local (localhost:3306)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_tpo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecommerce_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecommerce_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ==============================================
# Estrategia de generación de esquema:
# - create: Crea el esquema cada vez (elimina datos existentes)
# - update: Actualiza el esquema sin perder datos
# - validate: Solo valida que el esquema coincida con las entidades
# - create-drop: Crea al inicio y elimina al finalizar
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (útil para debugging)
spring.jpa.show-sql=true

# Formatea las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Inicializa la base de datos con datos
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==============================================
# CONFIGURACIÓN DE LOGS
# ==============================================
# Nivel de logging para ver más información durante el desarrollo
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==============================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# ==============================================
# Deshabilitamos temporalmente CSRF para facilitar pruebas con Postman
# En producción con frontend, esto se configuraría apropiadamente
spring.security.filter.order=5

# JWT Configuration (con soporte para variables de entorno)
# Secret key para firmar los tokens JWT (en producción usar una más segura)
# Generada Base64 valida para HMAC-SHA256 (256 bits)
jwt.secret=${JWT_SECRET:QD5jUmZValhuMnI1dTh4L0EzRkQoRytLQnBQZFNnVmtZcA==}
# Tiempo de expiración del token en milisegundos (86400000ms = 24 horas)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================
# CONFIGURACIÓN DE ACTUATOR (MONITOREO)
# ==============================================
# Exponer endpoints de actuator
management.endpoints.web.exposure.include=health,info,metrics
# Mostrar detalles de health solo cuando está autorizado
management.endpoint.health.show-details=when-authorized
# Mostrar componentes del health check
management.endpoint.health.show-components=always
# Puerto de management (usar mismo puerto que la app)
management.server.port=${server.port}
# Base path para endpoints de actuator
management.endpoints.web.base-path=/actuator

# ==============================================
# CONFIGURACIÓN ALTERNATIVA: H2 (DESARROLLO)
# ==============================================
# Para usar H2 en memoria, comentar la config de MySQL y descomentar estas líneas:
# spring.datasource.url=jdbc:h2:mem:ecommerce_db
# spring.datasource.driverClassName=org.h2.Driver
